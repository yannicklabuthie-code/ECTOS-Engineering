name: OMNIGATE QC02 QC03 V77 native engineering checks
on:
  pull_request:
    paths:
      - 'governance/omnigate/native_qc_v77/**'
      - '.github/workflows/omnigate-qc-v77-native-engineering.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema interpreter dependency
        run: python -m pip install 'jsonschema==4.26.0' 'cryptography==46.0.3'
      - name: Verify every exact V77 source member hash
        run: python governance/omnigate/native_qc_v77/verify_manifest.py
      - name: Run native Windows PowerShell 5.1 fail-closed boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ps51 = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $selftest = Join-Path $env:GITHUB_WORKSPACE 'governance\omnigate\native_qc_v77\source\qualification_center\v01\tests\Run-QC-V01-SelfTest.ps1'
          $work = Join-Path $env:RUNNER_TEMP 'qc-v77-native-selftest'
          & $ps51 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $selftest -WorkRoot $work
          if ($LASTEXITCODE -ne 0) { throw 'QC_V77_NATIVE_SELFTEST_FAILED' }
          $result = Get-Content -LiteralPath (Join-Path $work 'SELFTEST_RETURN.json') -Raw | ConvertFrom-Json
          if ($result.final_state -ne 'PRODUCER_SELFTEST_PASS_FAIL_CLOSED') { throw 'QC_V77_NATIVE_SELFTEST_RETURN_INVALID' }
          if ($result.unapproved_qc02_contract -ne 'BLOCKED_AS_EXPECTED') { throw 'QC02_NEGATIVE_AUTHORITY_GATE_FAILED' }
          Write-Output 'QC_V77_CI_ENGINEERING_ONLY_PASS'
