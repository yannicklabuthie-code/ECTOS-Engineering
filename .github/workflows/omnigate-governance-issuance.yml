# CANDIDATE WORKFLOW — NOT INSTALLED OR APPROVED.
# ECTOS UAC historically authorizes via role-bound signatures and separate
# provenance, not a mandatory second GitHub repository collaborator.
# The protected GitHub environment alone cannot establish authority.
# Require actual external governance-approved source pins, independently
# provisioned signing-key custody and a separate Windows public trust root.
name: OMNIGATE protected external authority issuance
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: omnigate-governance-issuance
  cancel-in-progress: false
jobs:
  issue:
    if: github.repository == 'yannicklabuthie-code/ECTOS-Engineering' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: omnigate-governance-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require independently approved source inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f authority_inputs/canonical_requirements.json
          test -f authority_inputs/QC02_APPROVED_REQUIREMENTS.json
          test -f authority_inputs/QC03_APPROVED_TOOL_REGISTRY.json
          # A checkout cannot establish authority by itself. Exact approved
          # SHA pins and the separately provisioned trust root are required.
          # GitHub collaborator review is not a historical UAC prerequisite.
      - name: Install pinned cryptographic dependency
        run: python -m pip install 'cryptography==46.0.3'
      - name: Issue owner-governance-authorized QC02 and QC03 envelopes
        env:
          OMNI_ED25519_KEY_SEED_B64: ${{ secrets.OMNI_ED25519_KEY_SEED_B64 }}
          APPROVED_PUBLIC_KEY_SHA256: ${{ vars.APPROVED_PUBLIC_KEY_SHA256 }}
          APPROVED_SOURCE_SHA256: ${{ vars.APPROVED_SOURCE_SHA256 }}
          APPROVED_QC02_CANONICAL_SHA256: ${{ vars.APPROVED_QC02_CANONICAL_SHA256 }}
          APPROVED_QC03_CANONICAL_SHA256: ${{ vars.APPROVED_QC03_CANONICAL_SHA256 }}
          GOVERNANCE_APPROVED_ISSUER_ID: ${{ vars.GOVERNANCE_APPROVED_ISSUER_ID }}
          GOVERNANCE_APPROVED_TARGET_SHA256: ${{ vars.GOVERNANCE_APPROVED_TARGET_SHA256 }}
        run: python governance/omnigate/issue_authority_universal_candidate.py
      - uses: actions/attest@v4
        with:
          subject-path: signed_authority/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: omni-external-authority
          path: signed_authority
          retention-days: 30
