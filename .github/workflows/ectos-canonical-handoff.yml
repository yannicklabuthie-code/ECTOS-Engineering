name: ECTOS Canonical Handoff

on:
  workflow_call:
    inputs:
      source_artifact_name:
        required: true
        type: string
      package_path:
        required: true
        type: string
      manifest_path:
        required: true
        type: string
      dependency_graph_path:
        required: true
        type: string
      request_path:
        required: true
        type: string
      source_commit_sha:
        required: true
        type: string
      source_repository:
        required: true
        type: string
      handoff_artifact_name:
        required: false
        type: string
        default: ectos-canonical-handoff
    secrets:
      ECTOS_UAC_SIGNING_KEY:
        required: true
      ECTOS_UAC_EVIDENCE_PUBLIC_KEYS:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  canonical_handoff:
    name: ectos/canonical-handoff
    if: github.repository == 'yannicklabuthie-code/ECTOS-Engineering'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UAC control plane
        uses: actions/checkout@v4
        with:
          repository: yannicklabuthie-code/ECTOS-Engineering
          ref: main
          path: .ectos-engineering

      - name: Download exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          path: candidate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve exact staged artifact paths
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python .ectos-engineering/uac/staged_paths.py \
            --root candidate \
            --package-path "${{ inputs.package_path }}" \
            --manifest-path "${{ inputs.manifest_path }}" \
            --dependency-graph-path "${{ inputs.dependency_graph_path }}" \
            --request-path "${{ inputs.request_path }}" \
            --output staged-paths.json
          echo "package_path=$(python -c 'import json; print(json.load(open("staged-paths.json", encoding="utf-8"))["package"])')" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$(python -c 'import json; print(json.load(open("staged-paths.json", encoding="utf-8"))["manifest"])')" >> "$GITHUB_OUTPUT"
          echo "dependency_graph_path=$(python -c 'import json; print(json.load(open("staged-paths.json", encoding="utf-8"))["dependency_graph"])')" >> "$GITHUB_OUTPUT"
          echo "request_path=$(python -c 'import json; print(json.load(open("staged-paths.json", encoding="utf-8"))["request"])')" >> "$GITHUB_OUTPUT"

      - name: Verify exact PRE_DISPATCH receipt presence
        shell: bash
        run: |
          set -euo pipefail
          test -f candidate/pre-dispatch/PRE_DISPATCH_RECEIPT.json || { echo 'PRE_DISPATCH_RECEIPT_NOT_FOUND'; exit 40; }

      - name: Attest live GitHub governance before signing
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p governance
          python .ectos-engineering/uac/github_governance.py \
            --output governance/GOVERNANCE_ATTESTATION.raw.json
          python -c 'import json,pathlib; p=pathlib.Path("governance/GOVERNANCE_ATTESTATION.raw.json"); v=json.loads(p.read_text(encoding="utf-8")); pathlib.Path("governance/GOVERNANCE_ATTESTATION.json").write_text(json.dumps(v,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8",newline="\n")'
          rm governance/GOVERNANCE_ATTESTATION.raw.json

      - name: Verify declared source repository and commit
        shell: python
        run: |
          import json
          from pathlib import Path
          request = json.loads(Path("${{ steps.resolve.outputs.request_path }}").read_text(encoding="utf-8"))
          pre = json.loads(Path("candidate/pre-dispatch/PRE_DISPATCH_RECEIPT.json").read_text(encoding="utf-8"))
          declared_repo = "${{ inputs.source_repository }}"
          declared_commit = "${{ inputs.source_commit_sha }}".lower()
          if request.get("source_repository") != declared_repo or pre.get("source_repository") != declared_repo:
              raise SystemExit("SOURCE_REPOSITORY_DECLARATION_MISMATCH")
          if str(request.get("source_commit", "")).lower() != declared_commit or str(pre.get("source_commit", "")).lower() != declared_commit:
              raise SystemExit("SOURCE_COMMIT_DECLARATION_MISMATCH")

      - name: Fail closed if authority material is unavailable
        shell: bash
        env:
          ECTOS_UAC_SIGNING_KEY: ${{ secrets.ECTOS_UAC_SIGNING_KEY }}
          ECTOS_UAC_EVIDENCE_PUBLIC_KEYS: ${{ secrets.ECTOS_UAC_EVIDENCE_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          test -n "$ECTOS_UAC_SIGNING_KEY" || { echo 'PRODUCTION_SIGNING_KEY_MISSING'; exit 40; }
          test -n "$ECTOS_UAC_EVIDENCE_PUBLIC_KEYS" || { echo 'AUTHORITY_EVIDENCE_PUBLIC_KEYRING_UNAVAILABLE'; exit 40; }

      - name: Materialize signed canonical handoff
        shell: bash
        env:
          ECTOS_UAC_SIGNING_KEY: ${{ secrets.ECTOS_UAC_SIGNING_KEY }}
          ECTOS_UAC_EVIDENCE_PUBLIC_KEYS: ${{ secrets.ECTOS_UAC_EVIDENCE_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          python .ectos-engineering/uac/handoff_cli.py issue \
            --package "${{ steps.resolve.outputs.package_path }}" \
            --manifest "${{ steps.resolve.outputs.manifest_path }}" \
            --dependency-graph "${{ steps.resolve.outputs.dependency_graph_path }}" \
            --request "${{ steps.resolve.outputs.request_path }}" \
            --pre-dispatch-receipt candidate/pre-dispatch/PRE_DISPATCH_RECEIPT.json \
            --staged-paths staged-paths.json \
            --output-dir handoff \
            --commit-sha "${{ inputs.source_commit_sha }}" \
            --governance-attestation governance/GOVERNANCE_ATTESTATION.json

      - name: Re-verify exact handoff before publication
        shell: bash
        env:
          ECTOS_UAC_SIGNING_KEY: ${{ secrets.ECTOS_UAC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python .ectos-engineering/uac/handoff_cli.py verify \
            --package "${{ steps.resolve.outputs.package_path }}" \
            --manifest "${{ steps.resolve.outputs.manifest_path }}" \
            --dependency-graph "${{ steps.resolve.outputs.dependency_graph_path }}" \
            --descriptor handoff/HANDOFF_DESCRIPTOR.json \
            --receipt handoff/UAC_RECEIPT.json \
            --pre-dispatch-receipt handoff/PRE_DISPATCH_RECEIPT.json \
            --staged-paths handoff/STAGED_PATHS.json \
            --governance-attestation handoff/GOVERNANCE_ATTESTATION.json \
            --expected-commit-sha "${{ inputs.source_commit_sha }}"

      - name: Assemble canonical handoff bundle
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.resolve.outputs.package_path }}" handoff/
          cp "${{ steps.resolve.outputs.manifest_path }}" handoff/
          cp "${{ steps.resolve.outputs.dependency_graph_path }}" handoff/
          sha256sum handoff/* > handoff/HANDOFF_SHA256SUMS.txt

      - name: Publish canonical handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.handoff_artifact_name }}
          path: handoff
          if-no-files-found: error
          retention-days: 30
